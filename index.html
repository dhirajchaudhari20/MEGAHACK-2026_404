<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agri-Intel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }
  </style>
  <script>
    // This script prevents a flash of the wrong theme. It's placed in the head 
    // to run before the body renders.
    (function() {
      window.global = window;
      try {
        const theme = localStorage.getItem('kissanMitraTheme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (_) {}
    })();
  </script>
  <link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-50 dark:bg-[#0D1117]">
  <div id="root"></div>
  <!-- This script will be generated at runtime by Cloud Run to inject the API key -->
  <script src="/config.js"></script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
